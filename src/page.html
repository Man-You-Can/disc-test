<script>
(function(){
'use strict';
var L = __LOCALE_JSON__;
var ROOT_REL = '__ROOT_REL__', SUBPATH = '__SUBPATH__';
var LANG_PATH = __LANG_PATH_JSON__, LANG_META = __LANG_META_JSON__;
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function t(key, vars){ var s = L.ui[key]; if(s==null) s = key; if(vars) s = s.replace(/\{(\w+)\}/g, function(_, n){ return vars[n]!=null ? vars[n] : '{'+n+'}'; }); return s; }
var MEM = {};
function lsGet(k){ try{ var v = localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} return Object.prototype.hasOwnProperty.call(MEM,k) ? MEM[k] : null; }
function lsSet(k,v){ MEM[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var PAGE_LANGS = __PAGE_LANGS_JSON__; /* языки, в которых есть эта страница (null — во всех); в остальных ссылка ведёт на главную языка */
function langHref(code){ return ROOT_REL + (LANG_PATH[code]||'') + (PAGE_LANGS && PAGE_LANGS.indexOf(code)<0 ? '' : SUBPATH) + location.hash; }
__COMMON_JS__
initCommon({L:L, t:t, esc:esc, lsGet:lsGet, lsSet:lsSet, langHref:langHref, $:$, langMeta:LANG_META, langPath:LANG_PATH, privacyHref:ROOT_REL+(LANG_PATH[L.lang]||'')+'privacy/', reportHref:ROOT_REL+(LANG_PATH[L.lang]||'')+'extended-report/', noXbar:__NO_XBAR__});
__PAGE_JS__
/* Первый блок теста в статье (#embedTest, с 2026-10-26; build.js → embedTest): выбор устроен как в тесте (по одному в каждой колонке).
   «Продолжить тест» кладёт ответ в disc.progress (как сам тест, только в браузере; на сервер ничего не уходит) с пометкой from — страница,
   откуда пришли, — и ведёт на главную с #test: там тест открывается на блоке 2, засчитываются старт и цели start / embed-start.
   Незаконченное прохождение не затирается: вместо блока — кнопка «Продолжить прошлое прохождение». Цель embed-pick — первый выбор на странице. */
(function(){
  var box = $('#embedTest'); if(!box) return;
  var nx = $('#etNext'), grid = box.querySelector('.qgrid'), rows = [].slice.call(box.querySelectorAll('.row')), asks = [].slice.call(box.querySelectorAll('.ask'));
  var prog = lsGet('disc.progress'), done = 0;
  if(prog && prog.m && prog.l && prog.m.length===24) for(var k=0;k<24;k++){ if(prog.m[k]>=0 && prog.l[k]>=0) done++; }
  if(done){
    box.querySelector('.et-test').hidden = true; box.querySelector('.et-lead').hidden = true; box.querySelector('.et-meta').textContent = '';
    nx.classList.remove('off'); nx.removeAttribute('aria-disabled'); nx.textContent = t('intro.resume', {n:done});
    return;
  }
  var m = -1, l = -1, picked = false;
  function setTag(row, s){ var x = row.querySelector('.tag');
    if(!s){ if(x) x.parentNode.removeChild(x); return; }
    if(!x){ x = document.createElement('span'); x.className = 'tag'; row.querySelector('.txt').appendChild(x); } x.textContent = s; }
  function render(){
    var need = m<0 ? 'm' : (l<0 ? 'l' : '');
    grid.className = 'qgrid'+(need ? ' need-'+need : '');
    rows.forEach(function(row, j){ var isM = m===j, isL = l===j;
      row.classList.toggle('is-most', isM); row.classList.toggle('is-least', isL);
      [['.pick.most', isM], ['.pick.least', isL]].forEach(function(p){ var b = row.querySelector(p[0]); b.classList.toggle('on', p[1]); b.setAttribute('aria-pressed', String(p[1])); });
      setTag(row, isM ? t('test.mostTag') : (isL ? t('test.leastTag') : '')); });
    asks.forEach(function(a, i){ var on = (i===0 && need==='m') || (i===1 && need==='l') || (i===2 && !need);
      a.classList.toggle('on', on); if(on) a.removeAttribute('aria-hidden'); else a.setAttribute('aria-hidden', 'true'); });
    nx.classList.toggle('off', !!need); if(need) nx.setAttribute('aria-disabled', 'true'); else nx.removeAttribute('aria-disabled');
  }
  box.querySelectorAll('.pick').forEach(function(btn){
    btn.addEventListener('click', function(){
      var j = +btn.getAttribute('data-j');
      if(btn.getAttribute('data-pick')==='m'){ m = m===j ? -1 : j; if(l===j) l = -1; }
      else { l = l===j ? -1 : j; if(m===j) m = -1; }
      if(!picked){ picked = true; if(window.discTrack) window.discTrack('embed-pick'); }
      render();
    });
  });
  nx.addEventListener('click', function(e){
    if(m<0 || l<0){ e.preventDefault();
      grid.classList.remove('nudge-m', 'nudge-l'); void grid.offsetWidth;
      if(m<0) grid.classList.add('nudge-m'); if(l<0) grid.classList.add('nudge-l'); return; }
    var S = {name:'', email:'', i:1, m:[], l:[], from:SUBPATH};
    for(var k=0;k<24;k++){ S.m.push(-1); S.l.push(-1); }
    S.m[0] = m; S.l[0] = l;
    lsSet('disc.progress', S);
  });
  // слово шире колонки переносится по слогам (как в тесте: fitRows)
  function fit(){ box.querySelectorAll('.row .txt').forEach(function(el){ el.classList.remove('hy'); if(el.scrollWidth > el.clientWidth) el.classList.add('hy'); }); }
  fit(); window.addEventListener('resize', fit);
})();
/* цели Метрики у кнопок теста (cta-top, cta-bottom, cta-float) и плавающая кнопка на телефоне: видна, когда призыв
   после вводного абзаца уже прокручен вверх, а нижний призыв и подвал ещё не на экране (аудит 3, п. 1) */
(function(){
  document.querySelectorAll('a[data-goal]').forEach(function(a){ a.addEventListener('click', function(){ if(window.discTrack) window.discTrack(a.getAttribute('data-goal')); }); });
  var fl = $('#ctaFloat'), top = $('.cta-top') || $('.cta.invite') || $('#embedTest');
  if(!fl || !top || !('IntersectionObserver' in window)) return;
  var passed = false, near = false, ends = [].slice.call(document.querySelectorAll('main .cta:not(.cta-top):not(.invite), .foot'));
  function upd(){ fl.classList.toggle('show', passed && !near); }
  new IntersectionObserver(function(es){ es.forEach(function(e){ passed = !e.isIntersecting && e.boundingClientRect.top < 0; }); upd(); }).observe(top);
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ e.target._vis = e.isIntersecting; }); near = ends.some(function(x){ return x._vis; }); upd(); });
  ends.forEach(function(x){ io.observe(x); });
})();
})();
</script>
