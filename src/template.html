<style>
:root{
  color-scheme:light;
  --paper:#F3F4F6; --surface:#FFFFFF; --ink:#1B2027; --muted:#5B6470;
  --line:#D9DDE3; --line-strong:#B4BBC5; --soft:#E9EBEF;
  --d:#C9453D; --i:#D6961F; --s:#3A9A69; --c:#3B6FB6;
  --btn:#1B2027; --btn-ink:#F7F8FA; --focus:#3B6FB6;
  --most:#1B2027; --least:#8A93A0;
  --shadow:0 1px 2px rgba(27,32,39,.05),0 10px 30px -18px rgba(27,32,39,.25);
  --font-head:__FONT_HEAD__;
  --font-body:__FONT_BODY__;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#14171B; --surface:#1C2026; --ink:#ECEEF1; --muted:#9AA3AE;
    --line:#2C323A; --line-strong:#4A525C; --soft:#242930;
    --d:#E2665E; --i:#E8B048; --s:#55B382; --c:#6390D4;
    --btn:#ECEEF1; --btn-ink:#14171B; --focus:#6390D4;
    --most:#ECEEF1; --least:#7F8894;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#14171B; --surface:#1C2026; --ink:#ECEEF1; --muted:#9AA3AE;
  --line:#2C323A; --line-strong:#4A525C; --soft:#242930;
  --d:#E2665E; --i:#E8B048; --s:#55B382; --c:#6390D4;
  --btn:#ECEEF1; --btn-ink:#14171B; --focus:#6390D4;
  --most:#ECEEF1; --least:#7F8894;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang=ar] body,html[lang=hi] body{font-size:17px;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 56px;transition:max-width .2s}
.wrap.wide{max-width:960px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 16px}
.brand{font-family:var(--font-head);font-weight:500;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;border-radius:6px}
.brand:hover{opacity:.75}
.brand .dots{display:inline-flex;gap:3px;direction:ltr}
.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.tools{display:flex;align-items:center;gap:12px;min-width:0}
.step{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{width:20px;height:13.5px;border-radius:2.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none;display:inline-block;vertical-align:-2px}
.langsel{position:relative}
.langbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;line-height:1.2;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.langbtn:hover{border-color:var(--muted)}
.langbtn .chev{width:12px;height:12px;color:var(--muted);flex:none}
.langbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
@media (max-width:380px){.langbtn .langname{display:none}}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:190px;z-index:20}
.langmenu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap}
.langmenu a:hover,.langmenu a:focus-visible{background:var(--soft)}
.langmenu a[aria-selected=true]{font-weight:600}
.langmenu a[aria-selected=true]::after{content:"✓";margin-inline-start:auto;padding-inline-start:10px;color:var(--muted);font-size:12px}
.progress{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:6px;margin:0 0 28px}
.progress i{display:block;background:var(--line);border-radius:2px;transition:background .2s}
.progress i.done{background:var(--ink)}
.progress i.cur{background:var(--ink);opacity:.35}
h1{font-family:var(--font-head);font-weight:500;font-size:clamp(26px,4.2vw,36px);line-height:1.2;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--font-head);font-weight:500;font-size:17px;line-height:1.35;margin:0 0 12px;text-wrap:balance}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
html[lang=ar] h3,html[lang=hi] h3,html[lang=zh] h3,html[lang=ja] h3,html[lang=ar] .eyebrow,html[lang=hi] .eyebrow,html[lang=zh] .eyebrow,html[lang=ja] .eyebrow{letter-spacing:.04em;font-size:13px}
p{margin:0 0 12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:12px}
.lead{font-size:18px;max-width:62ch;margin-bottom:22px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.card+.card,.stack>*+*{margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 26px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:10px;padding:12px 14px 12px}
.tile b{font-family:var(--font-head);font-weight:600;font-size:24px;color:var(--k);display:block;line-height:1;margin-bottom:6px}
.tile strong{display:block;font-weight:600;font-size:14px}
.tile span{display:block;font-size:13px;color:var(--muted)}
.form{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],textarea{font:inherit;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:96px;font-family:var(--font-mono);font-size:13px;line-height:1.5}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;white-space:nowrap;flex:none}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(.92)}
.link{background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:start}
.link:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions.between{justify-content:space-between}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot .row2{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot .privacy{margin-top:6px}
.langs{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px}
.langs a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.langs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.langs a[aria-current]{color:var(--ink);font-weight:600}
/* test */
.qhead{display:grid;grid-template-columns:64px 1fr 64px;align-items:end;gap:6px;padding-bottom:10px}
.qhead span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;line-height:1.25}
html[lang=ar] .qhead span,html[lang=hi] .qhead span,html[lang=zh] .qhead span,html[lang=ja] .qhead span{letter-spacing:0;font-size:12px}
.qhead .n{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:start;text-transform:none;letter-spacing:0;font-weight:400;direction:ltr}
.row{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;min-height:60px;border-top:1px solid var(--line);gap:6px}
.row .txt{font-size:17px;padding:12px 6px;line-height:1.35}
.row.is-most .txt{font-weight:600}
.row.is-least .txt{color:var(--muted)}
.pick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;margin:auto;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0;transition:background .15s,border-color .15s}
.pick svg{width:18px;height:18px;display:block}
.pick.most:hover{border-color:var(--most)}
.pick.least:hover{border-color:var(--least)}
.pick.most.on{background:var(--most);border-color:var(--most);color:var(--paper)}
.pick.least.on{background:var(--least);border-color:var(--least);color:var(--paper)}
@media (max-width:480px){.qhead,.row{grid-template-columns:52px 1fr 52px}.row .txt{font-size:16px}}
.testcard{padding:18px 22px 20px}
.testnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.hintline{font-size:13px;color:var(--muted);margin-top:14px}
/* report */
.rhead{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:18px}
@media (max-width:560px){.rhead{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:baseline;gap:2px;direction:ltr;font-family:var(--font-head);font-weight:600;font-size:64px;line-height:1;padding:14px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.badge .p{color:var(--kp)}
.badge .s{font-size:36px;color:var(--ks)}
.rtitle .eyebrow{margin-bottom:6px}
.rtitle h1{margin-bottom:6px}
.rtitle .meta{font-size:14px;color:var(--muted)}
.graphcard{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
@media (max-width:700px){.graphcard{grid-template-columns:1fr}}
.graph svg{width:100%;height:auto;display:block;direction:ltr}
.graph .ax{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.graph .kl{font-family:var(--font-head);font-size:14px;font-weight:600}
.graph .s1{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.graph .s2{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.graph .s3{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linejoin:round}
.graph circle.s1,.graph circle.s2{stroke-dasharray:none;stroke-width:1.5}
.graph circle.s3{stroke:var(--surface);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px}
.legend label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend .sw{width:22px;height:0;border-top:2.5px solid var(--ink);display:inline-block}
.legend .sw.s1{border-top:1.5px dashed var(--muted)}
.legend .sw.s2{border-top:1.5px dotted var(--muted)}
.stats{display:grid;gap:8px}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-inline-start:4px solid var(--k);padding:6px 0;padding-inline-start:12px}
.stat .k{font-family:var(--font-head);font-weight:600;font-size:18px;color:var(--k);width:22px}
.stat .nm{font-size:14px}
.stat .nm small{display:block;color:var(--muted);font-size:12px;font-family:var(--font-mono)}
.stat .v{font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--k);border-radius:3px}
.howto{font-size:13px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
@media (max-width:680px){.sections{grid-template-columns:1fr}}
.sec ul{margin:0;padding-inline-start:18px}
.sec li{margin-bottom:6px}
.sec.full{grid-column:1/-1}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.traits span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.substyle{border-inline-start:4px solid var(--ks);padding:4px 0;padding-inline-start:14px;margin-top:4px}
.share{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.codebox{font-family:var(--font-mono);font-size:12px;line-height:1.5;word-break:break-all;background:var(--paper);border:1px dashed var(--line-strong);padding:10px 12px;border-radius:8px;margin:12px 0;color:var(--ink);width:100%;min-height:0;resize:none;direction:ltr;text-align:left}
.notice{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
/* admin */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--paper)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:end;direction:ltr}
th.num{text-align:end}
.pill{display:inline-flex;align-items:baseline;gap:1px;direction:ltr;font-family:var(--font-head);font-weight:600;font-size:15px}
.pill .p{color:var(--kp)}.pill .s{color:var(--ks);font-size:12px}
.pill+small{font-weight:400;color:var(--muted);margin-inline-start:6px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:10;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#111}
  .topbar,.progress,.foot,.no-print,.toast,.legend{display:none!important}
  .wrap{max-width:none;padding:0}
  .card,.share,.badge{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .sections{grid-template-columns:1fr 1fr}
}
</style>

<script>
(function(){
'use strict';
/* ====== локаль и настройки ====== */
var L = __LOCALE_JSON__;
var CONTACT_EMAIL = '__EMAIL__'; // адрес получателя для кнопки «Отправить по почте»; пустой — участник вводит сам
var VERSION = 'DISC1';

var KEYS = ['D','I','S','C'];
/* Порядок стилей в каждом из 24 блоков. Менять нельзя: от него зависят коды результатов. */
var BLOCK_KEYS = ['IDCS','CSDI','SCID','DSIC','ICSD','SDCI','CIDS','DCSI','ISDC','CDIS','SICD','DISC','ICDS','CSID','SDCI','DCSI','ISDC','CISD','SCDI','DSIC','IDCS','CSID','SIDC','DCIS'];
var BLOCKS = BLOCK_KEYS.map(function(ks,i){ return ks.split('').map(function(k){ return {k:k, t:L.blocks[i][k]}; }); });

function t(key, vars){
  var s = L.ui[key]; if(s==null) s = key;
  if(vars) s = s.replace(/\{(\w+)\}/g, function(_, n){ return vars[n]!=null ? vars[n] : '{'+n+'}'; });
  return s;
}

/* ====== утилиты ====== */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var MEM = {};
function lsGet(k){ try{ var v = localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} return Object.prototype.hasOwnProperty.call(MEM,k) ? MEM[k] : null; }
function lsSet(k,v){ MEM[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} }
function fmtDate(iso){ var d = iso ? new Date(iso) : new Date(); if(isNaN(d)) return ''; try{ return d.toLocaleDateString(L.dateLocale,{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return d.toLocaleDateString(); } }
function fmtDateShort(iso){ var d = iso ? new Date(iso) : new Date(); if(isNaN(d)) return ''; try{ return d.toLocaleDateString(L.dateLocale,{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return d.toLocaleDateString(); } }
function signed(n){ return (n>0?'+':'')+n; }
function pct(net){ return Math.round((net+24)/48*100); }
var toastT;
function toast(msg){ var el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ el.hidden=true; }, 2400); }
function copyText(text, el){
  function fallback(){
    if(el){ el.focus(); el.select(); }
    try{ if(document.execCommand('copy')){ toast(t('toast.copied')); return; } }catch(e){}
    toast(t('toast.copyManual'));
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(t('toast.copied')); }, fallback);
  } else fallback();
}
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }
function pageURL(){ return location.href.split('#')[0]; }

/* ====== результат: кодирование, подсчёт ====== */
function encodeResult(r){ return VERSION+'.'+b64e(JSON.stringify({n:r.name, p:r.pos||'', t:r.t, m:r.m.join(''), l:r.l.join('')})); }
function decodeResult(str){
  var m = String(str||'').match(new RegExp(VERSION+'\\.([A-Za-z0-9_-]+)'));
  if(!m) return null;
  try{
    var o = JSON.parse(b64d(m[1]));
    if(typeof o.n!=='string' || !/^[0-3]{24}$/.test(o.m) || !/^[0-3]{24}$/.test(o.l)) return null;
    var mm = o.m.split('').map(Number), ll = o.l.split('').map(Number);
    for(var i=0;i<24;i++) if(mm[i]===ll[i]) return null;
    return {name:o.n.slice(0,80), pos:String(o.p||'').slice(0,80), t:String(o.t||''), m:mm, l:ll};
  }catch(e){ return null; }
}
function findCodes(text){ return String(text||'').match(new RegExp(VERSION+'\\.[A-Za-z0-9_-]+','g')) || []; }
function score(r){
  var most={D:0,I:0,S:0,C:0}, least={D:0,I:0,S:0,C:0}, net={};
  for(var i=0;i<24;i++){ most[BLOCKS[i][r.m[i]].k]++; least[BLOCKS[i][r.l[i]].k]++; }
  KEYS.forEach(function(k){ net[k]=most[k]-least[k]; });
  return {most:most, least:least, net:net};
}
function classify(sc){
  var ord = KEYS.slice().sort(function(a,b){ return sc.net[b]-sc.net[a]; });
  var p=ord[0], s=ord[1];
  var sec = sc.net[s]>0 && sc.net[s] >= Math.max(3, Math.round(sc.net[p]*0.4));
  return {p:p, s:sec?s:null, key:p+(sec?s:''), flat: sc.net[p]<=2};
}
function analyze(r){ var sc=score(r); var c=classify(sc); return {sc:sc, cls:c, profile:L.profiles[c.key]}; }
function colorVar(k){ return 'var(--'+k.toLowerCase()+')'; }
function badgeHTML(cls, cssClass){
  return '<span class="'+(cssClass||'badge')+'" style="--kp:'+colorVar(cls.p)+';--ks:'+(cls.s?colorVar(cls.s):'inherit')+'"><span class="p">'+cls.p+'</span>'+(cls.s?'<span class="s">'+cls.s+'</span>':'')+'</span>';
}

/* ====== график ====== */
function graphSVG(sc, show){
  var W=380,H=252,Lm=34,R=14,T=14,B=32,pw=W-Lm-R,ph=H-T-B;
  function x(i){ return (Lm+pw*(i+0.5)/4).toFixed(1); }
  function y(v){ return (T+ph*(24-v)/24).toFixed(1); }
  var g='';
  [0,6,12,18,24].forEach(function(v){
    var mid = v===12;
    g+='<line x1="'+Lm+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(mid?'var(--line-strong)':'var(--line)')+'" stroke-width="'+(mid?1.5:1)+'"'+(mid?' stroke-dasharray="4 3"':'')+'/>';
    g+='<text x="'+(Lm-7)+'" y="'+(+y(v)+3.5)+'" text-anchor="end" class="ax">'+v+'</text>';
  });
  KEYS.forEach(function(k,i){ g+='<text x="'+x(i)+'" y="'+(H-9)+'" text-anchor="middle" class="kl" fill="'+colorVar(k)+'">'+k+'</text>'; });
  var series=[
    {key:'most', cls:'s1', vals:KEYS.map(function(k){ return sc.most[k]; })},
    {key:'least', cls:'s2', vals:KEYS.map(function(k){ return 24-sc.least[k]; })},
    {key:'net', cls:'s3', vals:KEYS.map(function(k){ return (sc.net[k]+24)/2; })}
  ];
  series.forEach(function(s){
    if(!show[s.key]) return;
    g+='<polyline class="'+s.cls+'" points="'+s.vals.map(function(v,i){ return x(i)+','+y(v); }).join(' ')+'"/>';
    s.vals.forEach(function(v,i){
      var main = s.key==='net';
      g+='<circle class="'+s.cls+'" cx="'+x(i)+'" cy="'+y(v)+'" r="'+(main?5.5:3.5)+'" fill="'+(main?colorVar(KEYS[i]):'var(--surface)')+'"'+(main?'':' stroke="var(--muted)"')+'/>';
    });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('report.graphAria')+'">'+g+'</svg>';
}

(function(){
  var box=$('#langSel'), btn=$('#langBtn'), menu=$('#langMenu');
  if(!box||!btn||!menu) return;
  var items=[].slice.call(menu.querySelectorAll('a[data-lang]'));
  function open(){
    items.forEach(function(a){ a.href=langHref(a.getAttribute('data-lang')); });
    menu.hidden=false; btn.setAttribute('aria-expanded','true');
    var cur=menu.querySelector('a[aria-selected="true"]')||items[0]; try{ cur.focus({preventScroll:true}); }catch(e){ cur.focus(); }
  }
  function close(focusBtn){ if(menu.hidden) return; menu.hidden=true; btn.setAttribute('aria-expanded','false'); if(focusBtn) btn.focus(); }
  btn.addEventListener('click', function(){ menu.hidden ? open() : close(false); });
  btn.addEventListener('keydown', function(e){ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); open(); } });
  menu.addEventListener('keydown', function(e){
    var i=items.indexOf(document.activeElement), n=items.length;
    if(e.key==='Escape'){ e.preventDefault(); close(true); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%n].focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+n)%n].focus(); }
    else if(e.key==='Home'){ e.preventDefault(); items[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); items[n-1].focus(); }
    else if(e.key==='Tab'){ close(false); }
  });
  document.addEventListener('click', function(e){ if(!box.contains(e.target)) close(false); });
})();

/* ====== маршрутизация ====== */
$('#adminLink').addEventListener('click', function(){ renderAdmin(); window.scrollTo(0,0); });
$('#brand').addEventListener('click', function(e){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0) return; // новая вкладка и т.п. — обычная ссылка
  e.preventDefault(); clearTimeout(advanceT); S=null;
  if(location.hash) history.replaceState(null,'',pageURL());
  renderIntro(); window.scrollTo(0,0);
});
function route(){
  var h = location.hash||'';
  if(h==='#admin'){ renderAdmin(); return true; }
  if(h.indexOf('#r=')===0){ var r = decodeResult(decodeURIComponent(h.slice(3))); if(r){ renderReport(r, {own:false}); return true; } }
  return false;
}
window.addEventListener('hashchange', function(){ if(!route() && !S) renderIntro(); });
if(!route()) renderIntro();
})();
</script>
