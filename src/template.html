<style>
:root{
  color-scheme:light;
  --paper:#F3F4F6; --surface:#FFFFFF; --ink:#1B2027; --muted:#5B6470;
  --line:#D9DDE3; --line-strong:#B4BBC5; --soft:#E9EBEF;
  --d:#C9453D; --i:#D6961F; --s:#3A9A69; --c:#3B6FB6;
  --btn:#1B2027; --btn-ink:#F7F8FA; --focus:#3B6FB6;
  --most:#1B2027; --least:#8A93A0;
  --shadow:0 1px 2px rgba(27,32,39,.05),0 10px 30px -18px rgba(27,32,39,.25);
  --font-head:__FONT_HEAD__;
  --font-body:__FONT_BODY__;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#14171B; --surface:#1C2026; --ink:#ECEEF1; --muted:#9AA3AE;
    --line:#2C323A; --line-strong:#4A525C; --soft:#242930;
    --d:#E2665E; --i:#E8B048; --s:#55B382; --c:#6390D4;
    --btn:#ECEEF1; --btn-ink:#14171B; --focus:#6390D4;
    --most:#ECEEF1; --least:#7F8894;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#14171B; --surface:#1C2026; --ink:#ECEEF1; --muted:#9AA3AE;
  --line:#2C323A; --line-strong:#4A525C; --soft:#242930;
  --d:#E2665E; --i:#E8B048; --s:#55B382; --c:#6390D4;
  --btn:#ECEEF1; --btn-ink:#14171B; --focus:#6390D4;
  --most:#ECEEF1; --least:#7F8894;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang=ar] body,html[lang=hi] body{font-size:17px;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 16px}
.brand{font-family:var(--font-head);font-weight:500;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;border-radius:6px}
.brand:hover{opacity:.75}
.brand .dots{display:inline-flex;gap:3px;direction:ltr}
.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.tools{display:flex;align-items:center;gap:12px;min-width:0}
.step{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{width:20px;height:13.5px;border-radius:2.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none;display:inline-block;vertical-align:-2px}
.langsel{position:relative}
.langbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;line-height:1.2;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.langbtn:hover{border-color:var(--muted)}
.langbtn .chev{width:12px;height:12px;color:var(--muted);flex:none}
.langbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
@media (max-width:380px){.langbtn .langname{display:none}}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:190px;z-index:25}
/* длинный список языков: на широком экране две колонки (число строк --lrows задаёт сборка), на узком — прокрутка; z-index выше плашки cookie, иначе она закрывает нижние пункты */
.langmenu{max-height:calc(100vh - 84px);overflow-y:auto;overscroll-behavior:contain}
@media (min-width:600px){.langmenu:not([hidden]){display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--lrows,7),auto);column-gap:4px}}
.langmenu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap}
.langmenu a:hover,.langmenu a:focus-visible{background:var(--soft)}
.langmenu a[aria-selected=true]{font-weight:600;background:var(--line)}
.sitenav{display:flex;flex-wrap:wrap;gap:2px 18px;margin:-6px 0 18px;font-size:14px}
.sitenav a{color:var(--muted);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.sitenav a:hover{color:var(--ink)}
.sitenav a[aria-current]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
/* телефон: меню разделов в одну строку с горизонтальной прокруткой, чтобы тест оставался на первом экране */
@media (max-width:640px){
  .sitenav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-20px;padding-inline:20px;mask-image:linear-gradient(to right,#000 85%,transparent);-webkit-mask-image:linear-gradient(to right,#000 85%,transparent)}
  html[dir=rtl] .sitenav{mask-image:linear-gradient(to left,#000 85%,transparent);-webkit-mask-image:linear-gradient(to left,#000 85%,transparent)}
  .sitenav::-webkit-scrollbar{display:none}
  .sitenav a{white-space:nowrap;flex:none}
}
.crumbs{font-size:13px;color:var(--muted);margin:0 0 16px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs span{margin:0 6px}
.content h2{font-size:22px;margin:32px 0 10px}

.content .more:hover{border-bottom-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pcard{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);text-decoration:none}
.pcard:hover{border-color:var(--line-strong)}
.pcard .badge{font-size:26px;padding:8px 10px;border-radius:9px;flex:none}
.pcard .badge .s{font-size:16px}
.pcard strong{display:block;font-family:var(--font-head);font-weight:600;font-size:15px;margin-bottom:2px}

.pcard p{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;margin:12px 0}
.chips a{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px}
.chips a:hover{border-color:var(--line-strong)}
.chips .pill{font-size:14px}

.cta div{flex:1 1 300px}
.cta h2{margin:0 0 6px;font-size:20px;color:inherit}
.cta p{margin:0;opacity:.85;font-size:14px}
.cta .btn{background:var(--btn-ink);color:var(--btn);flex:none}
.cta.invite{margin:0 0 24px}
/* призыв сразу после вводного абзаца контентных страниц и плавающая кнопка на телефоне (аудит 3, п. 1) */
.cta.cta-top{padding:14px 18px;margin:18px 0 26px;gap:10px 18px}
.cta.cta-top p{flex:1 1 240px;font-size:15px;opacity:.9}
.btn.ctafloat{display:none}
@media (max-width:640px){.btn.ctafloat.show{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 8px 24px -6px rgba(0,0,0,.35)}body.has-consent .btn.ctafloat{display:none}}
.stylecard .more{display:inline-block;margin-top:10px;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.stylecard .more:hover{border-bottom-color:var(--ink)}
.styles-intro .all{margin-top:14px;font-size:14px}
.styles-intro .all a{color:var(--ink)}
/* названия других языков на китайских и японских страницах: китайский шрифт рисует кириллицу и латиницу моноширинно, вразрядку */
html[lang|=zh] [lang]:not([lang|=zh]):not([lang|=ja]),html[lang=ja] [lang]:not([lang|=zh]):not([lang|=ja]){font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
.langbar{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.langbar a{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:1;min-width:0}

.langbar a:hover span{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.langbar-x{background:none;border:0;font:inherit;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}

.styles-intro{margin-top:34px}
.home-more{margin-top:34px}

.styles-intro h2{font-size:22px;margin-bottom:14px}
.stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.stylegrid{grid-template-columns:1fr}}

h1{font-family:var(--font-head);font-weight:500;font-size:clamp(26px,4.2vw,36px);line-height:1.2;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--font-head);font-weight:500;font-size:17px;line-height:1.35;margin:0 0 12px;text-wrap:balance}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
html[lang=ar] h3,html[lang=hi] h3,html[lang|=zh] h3,html[lang=ja] h3,html[lang=ar] .eyebrow,html[lang=hi] .eyebrow,html[lang|=zh] .eyebrow,html[lang=ja] .eyebrow{letter-spacing:.04em;font-size:13px}
p{margin:0 0 12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:12px}
.lead{font-size:18px;max-width:62ch;margin-bottom:22px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}

.tile b{font-family:var(--font-head);font-weight:600;font-size:24px;color:var(--k);display:block;line-height:1;margin-bottom:6px}

.form{display:grid;gap:14px}

input[type=text],input[type=email],textarea{font:inherit;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}

input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;white-space:nowrap;flex:none}

<script>
(function(){
'use strict';
/* ====== локаль и настройки ====== */
var L = __LOCALE_JSON__;
var CONTACT_EMAIL = '__EMAIL__'; // адрес получателя для кнопки «Отправить по почте»; пустой — участник вводит сам
var SEND_ENDPOINT = '__SEND_ENDPOINT__'; // URL веб-приложения Google Apps Script (см. README); пустой — письма не отправляются
var SEND_TOKEN = '__SEND_TOKEN__';
var ROOT_REL = '__ROOT_REL__';           // относительный путь к корню сайта ('./' на главной, '../' в /xx/)
var IS_ROOT = '__IS_ROOT__' === '1';      // главная страница (язык по умолчанию живёт в корне)
var LANG_PATH = __LANG_PATH_JSON__;       // код языка → путь от корня ('' для языка по умолчанию, 'ru/' и т. д.)
var LANG_META = __LANG_META_JSON__;       // код языка → {name, cont, dir} для подсказки «Продолжить на …»
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
var VERSION = 'DISC1';

var KEYS = ['D','I','S','C'];
/* Порядок стилей в каждом из 24 блоков. Менять нельзя: от него зависят коды результатов. */
var BLOCK_KEYS = ['IDCS','CSDI','SCID','DSIC','ICSD','SDCI','CIDS','DCSI','ISDC','CDIS','SICD','DISC','ICDS','CSID','SDCI','DCSI','ISDC','CISD','SCDI','DSIC','IDCS','CSID','SIDC','DCIS'];
var BLOCKS = BLOCK_KEYS.map(function(ks,i){ return ks.split('').map(function(k){ return {k:k, t:L.blocks[i][k]}; }); });

function t(key, vars){
  var s = L.ui[key]; if(s==null) s = key;
  if(vars) s = s.replace(/\{(\w+)\}/g, function(_, n){ return vars[n]!=null ? vars[n] : '{'+n+'}'; });
  return s;
}

/* ====== утилиты ====== */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var MEM = {};
function lsGet(k){ try{ var v = localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} return Object.prototype.hasOwnProperty.call(MEM,k) ? MEM[k] : null; }
function lsSet(k,v){ MEM[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} }
function fmtDate(iso){ var d = iso ? new Date(iso) : new Date(); if(isNaN(d)) return ''; try{ return d.toLocaleDateString(L.dateLocale,{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return d.toLocaleDateString(); } }
function fmtDateShort(iso){ var d = iso ? new Date(iso) : new Date(); if(isNaN(d)) return ''; try{ return d.toLocaleDateString(L.dateLocale,{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return d.toLocaleDateString(); } }
function signed(n){ return (L.dir==='rtl'?'\u200E':'')+(n>0?'+':'')+n; } // LRM: в арабском знак иначе встаёт после числа
function pct(net){ return Math.round((net+24)/48*100); }
var toastT;
function toast(msg){ var el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ el.hidden=true; }, 2400); }
function copyText(text, el){
  function fallback(){
    if(el){ el.focus(); el.select(); }
    try{ if(document.execCommand('copy')){ toast(t('toast.copied')); return; } }catch(e){}
    toast(t('toast.copyManual'));
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(t('toast.copied')); }, fallback);
  } else fallback();
}
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }
function pageURL(){ return location.href.split('#')[0]; }

/* ====== результат: кодирование, подсчёт ====== */
function encodeResult(r){ return VERSION+'.'+b64e(JSON.stringify({n:r.name, e:r.email||'', p:r.pos||'', t:r.t, m:r.m.join(''), l:r.l.join('')})); }
function decodeResult(str){
  var m = String(str||'').match(new RegExp(VERSION+'\\.([A-Za-z0-9_-]+)'));
  if(!m) return null;
  try{
    var o = JSON.parse(b64d(m[1]));
    if(typeof o.n!=='string' || !/^[0-3]{24}$/.test(o.m) || !/^[0-3]{24}$/.test(o.l)) return null;
    var mm = o.m.split('').map(Number), ll = o.l.split('').map(Number);
    for(var i=0;i<24;i++) if(mm[i]===ll[i]) return null;
    return {name:o.n.slice(0,80), email:String(o.e||'').slice(0,120), pos:String(o.p||'').slice(0,80), t:String(o.t||''), m:mm, l:ll};
  }catch(e){ return null; }
}
function findCodes(text){ return String(text||'').match(new RegExp(VERSION+'\\.[A-Za-z0-9_-]+','g')) || []; }
function score(r){
  var most={D:0,I:0,S:0,C:0}, least={D:0,I:0,S:0,C:0}, net={};
  for(var i=0;i<24;i++){ most[BLOCKS[i][r.m[i]].k]++; least[BLOCKS[i][r.l[i]].k]++; }
  KEYS.forEach(function(k){ net[k]=most[k]-least[k]; });
  return {most:most, least:least, net:net};
}
function classify(sc){
  var ord = KEYS.slice().sort(function(a,b){ return sc.net[b]-sc.net[a]; });
  var p=ord[0], s=ord[1];
  var sec = sc.net[s]>0 && sc.net[s] >= Math.max(3, Math.round(sc.net[p]*0.4));
  return {p:p, s:sec?s:null, key:p+(sec?s:''), flat: sc.net[p]<=2};
}
function analyze(r){ var sc=score(r); var c=classify(sc); return {sc:sc, cls:c, profile:L.profiles[c.key]}; }
function colorVar(k){ return 'var(--'+k.toLowerCase()+')'; }
function badgeHTML(cls, cssClass){
  return '<span class="'+(cssClass||'badge')+'" style="--kp:'+colorVar(cls.p)+';--ks:'+(cls.s?colorVar(cls.s):'inherit')+'"><span class="p">'+cls.p+'</span>'+(cls.s?'<span class="s">'+cls.s+'</span>':'')+'</span>';
}

/* ====== состояние ====== */
var view = $('#view'), stepEl = $('#step'), progEl = $('#progress');
var S = null;

function setStep(text){ stepEl.textContent = text||''; var nav=$('#sitenav'); if(nav) nav.hidden = !!text; }
function renderProgress(i){
  var h=''; for(var k=0;k<24;k++){ h+='<i class="'+(k<i?'done':(k===i?'cur':''))+'"></i>'; }
  progEl.innerHTML=h; progEl.hidden=false;
}

/* ====== экран 1: вступление ====== */
__INTRO_JS__
function renderIntro(){
  setStep(''); progEl.hidden=true;
  var last = lsGet('disc.last'), prog = lsGet('disc.progress');
  var progDone = prog && prog.m && prog.m.filter(function(x){return x>=0;}).length;
  view.innerHTML = introHTML({L:L, t:t, esc:esc, KEYS:KEYS, colorVar:colorVar, progDone:progDone, lastDate: last ? fmtDate(last.t) : '', links:{styles: ROOT_REL+LANG_PATH[L.lang]+'styles/', profiles: ROOT_REL+LANG_PATH[L.lang]+'profiles/', pdf: ROOT_REL+LANG_PATH[L.lang]+'pdf/', results: ROOT_REL+LANG_PATH[L.lang]+'results/', faq: ROOT_REL+LANG_PATH[L.lang]+'faq/', profile: function(k){ return ROOT_REL+LANG_PATH[L.lang]+'profiles/'+k.toLowerCase()+'/'; }}});
  // Тест начинается сразу, без регистрации: имя и e-mail участник по желанию вводит на экране результата
  function start(){
    S = {name:'', email:'', i:0, m:[], l:[]};
    for(var k=0;k<24;k++){ S.m.push(-1); S.l.push(-1); }
    if(window.discTrack) window.discTrack('start'); // цель Метрики: тест начат
    lsSet('disc.progress', S);
    renderTest(); window.scrollTo(0,0);
  }
  $('#start').addEventListener('click', start);
  $('#start2').addEventListener('click', start);
  if($('#resume')) $('#resume').addEventListener('click', function(){ S = prog; var first = S.m.findIndex(function(x,i){ return x<0 || S.l[i]<0; }); S.i = first<0 ? 23 : first; renderTest(); window.scrollTo(0,0); });
  if($('#showLast')) $('#showLast').addEventListener('click', function(){ renderReport(last, {own:true}); window.scrollTo(0,0); });
}

/* ====== экран 2: тест ====== */
function renderTest(){
  var i = S.i, b = BLOCKS[i];
  setStep(t('test.step',{n:i+1})); renderProgress(i);
  var checkIco = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
  var minusIco = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 10h10"/></svg>';
  var rows = b.map(function(it, j){
    var isM = S.m[i]===j, isL = S.l[i]===j;
    return '<div class="row'+(isM?' is-most':'')+(isL?' is-least':'')+'" data-j="'+j+'">'+
      '<button type="button" class="pick most'+(isM?' on':'')+'" data-pick="m" data-j="'+j+'" aria-pressed="'+isM+'" aria-label="'+t('test.mostAria',{t:esc(it.t)})+'">'+checkIco+'</button>'+
      '<div class="txt">'+esc(it.t)+'</div>'+
      '<button type="button" class="pick least'+(isL?' on':'')+'" data-pick="l" data-j="'+j+'" aria-pressed="'+isL+'" aria-label="'+t('test.leastAria',{t:esc(it.t)})+'">'+minusIco+'</button>'+
    '</div>';
  }).join('');
  var both = S.m[i]>=0 && S.l[i]>=0, lastBlock = i===23;
  view.innerHTML =
    '<div class="card testcard">'+
      '<div class="qhead"><span>'+t('test.mostHead')+'</span><span class="n">'+t('test.counter',{n:i+1})+'</span><span>'+t('test.leastHead')+'</span></div>'+
      rows+
      '<div class="testnav">'+
        '<button class="btn secondary small" type="button" id="prev" '+(i===0?'disabled':'')+'>'+t('test.prev')+'</button>'+
        '<button class="btn small" type="button" id="next" '+(both?'':'disabled')+'>'+(lastBlock?t('test.finish'):t('test.next'))+'</button>'+
      '</div>'+
    '</div>'+
    '<p class="hintline">'+t('test.hint',{next:t('test.next')})+'</p>';
  view.querySelectorAll('.pick').forEach(function(btn){
    btn.addEventListener('click', function(){
      var j = +btn.getAttribute('data-j'), which = btn.getAttribute('data-pick');
      if(which==='m'){ S.m[i] = (S.m[i]===j) ? -1 : j; if(S.l[i]===j) S.l[i]=-1; }
      else { S.l[i] = (S.l[i]===j) ? -1 : j; if(S.m[i]===j) S.m[i]=-1; }
      lsSet('disc.progress', S);
      renderTest(); // переход к следующему блоку только по кнопке «Далее»
    });
  });
  $('#prev').addEventListener('click', function(){ if(S.i>0){ S.i--; lsSet('disc.progress', S); renderTest(); } });
  $('#next').addEventListener('click', function(){
    if(!(S.m[i]>=0 && S.l[i]>=0)) return;
    if(i<23){ S.i=i+1; lsSet('disc.progress', S); renderTest(); return; }
    var missing = -1; for(var k=0;k<24;k++){ if(S.m[k]<0||S.l[k]<0){ missing=k; break; } }
    if(missing>=0){ S.i=missing; lsSet('disc.progress', S); toast(t('test.missing',{n:missing+1})); renderTest(); return; }
    var r = {name:S.name, email:S.email||'', pos:S.pos||'', t:new Date().toISOString(), m:S.m.slice(), l:S.l.slice()};
    lsSet('disc.last', r); lsDel('disc.progress'); S=null;
    if(window.discTrack) window.discTrack('finish'); // цель Метрики: тест завершён
    renderReport(r, {own:true});
    window.scrollTo(0,0);
  });
}

function renderReport(r, opts){
  opts = opts||{};
  progEl.hidden=true; setStep(opts.own ? t('report.own') : t('report.other'));
  var a = analyze(r), sc=a.sc, cls=a.cls, st=L.styles[cls.p], prof=a.profile;
  var code = encodeResult(r);
  var link = pageURL()+'#r='+code;
  var show = {most:false, least:false, net:true};
  var meta = [esc(r.name), esc(r.email||r.pos||''), fmtDate(r.t)].filter(Boolean).join(' · ');
  var who = lsGet('disc.who')||{};
  var label = cls.key+' · '+prof.name;
  var lines = KEYS.map(function(k){ return k+': '+signed(sc.net[k])+' ('+pct(sc.net[k])+'%)'; }).join(', ');
  var mailBody = t('mail.title')+'\r\n'+(r.name?t('mail.name')+': '+r.name+'\r\n':'')+(r.email?t('mail.email')+': '+r.email+'\r\n':'')+t('mail.date')+': '+fmtDate(r.t)+'\r\n'+t('mail.profile')+': '+label+'\r\n'+lines+'\r\n\r\n'+t('mail.link')+':\r\n'+link+'\r\n\r\n'+t('mail.code')+':\r\n'+code+'\r\n';
  var mailSubject = r.name ? t('mail.subject',{name:r.name,label:label}) : 'DISC: '+label;
  var mailto = function(to){ return 'mailto:'+(to?encodeURIComponent(to):'')+'?subject='+encodeURIComponent(mailSubject)+'&body='+encodeURIComponent(mailBody); };
  var base = ROOT_REL+LANG_PATH[L.lang];
  var profileHref = base+'profiles/'+cls.key.toLowerCase()+'/';
  // публичная страница профиля: ни имени, ни e-mail, ни ответов в ссылке нет
  var homeURL = new URL(base, location.href).href, profileURL = new URL(profileHref, location.href).href, shareMsg = t('share.typeMsg',{name:prof.name, key:cls.key});
  var co = L.content && L.content.colors;
  var colorName = co ? [cls.p].concat(cls.s?[cls.s]:[]).map(function(k){ return co.colors[k].name; }).join(' + ') : '';

  function list(arr){ return '<ul>'+arr.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'; }

  view.innerHTML =
    (opts.fromAdmin ? '<p class="no-print"><button class="link" id="backAdmin" type="button">'+t('report.backAdmin')+'</button></p>' : '')+
    // только в печати («Сохранить в PDF»): адрес сайта сверху и призыв пройти тест под описанием — PDF с результатом пересылают другим
    '<div class="print-only printhead"><b>'+esc(L.brand)+'</b><span>'+esc(t('pages.profile.descCta'))+' <b>'+esc(homeURL)+'</b></span></div>'+
    '<div class="rhead">'+
      badgeHTML(cls)+
      '<div class="rtitle"><div class="eyebrow">'+esc(cls.s ? L.keys[cls.p]+' + '+L.keys[cls.s] : L.keys[cls.p])+'</div>'+
        '<h1>'+esc(prof.name)+'</h1>'+
        '<div class="meta ym-hide-content">'+meta+'</div></div>'+
    '</div>'+
    '<p class="lead">'+esc(prof.summary)+'</p>'+
    (cls.flat ? '<p class="notice">'+t('report.flat')+'</p>' : '')+
    '<div class="card graphcard">'+
      '<div class="graph"><h3>'+t('report.graphTitle')+'</h3><div id="graph">'+graphSVG(sc, show, {label:t('report.graphAria'), colorVar:colorVar, keys:KEYS})+'</div>'+
        '<div class="legend no-print">'+
          '<label><input type="checkbox" data-s="net" checked> <span class="sw"></span> '+t('report.legendNet')+'</label>'+
          '<label><input type="checkbox" data-s="most"> <span class="sw s1"></span> '+t('report.legendMost')+'</label>'+
          '<label><input type="checkbox" data-s="least"> <span class="sw s2"></span> '+t('report.legendLeast')+'</label>'+
        '</div>'+
      '</div>'+
      '<div><h3>'+t('report.statsTitle')+'</h3><div class="stats">'+
        KEYS.map(function(k){ return '<div class="stat" style="--k:'+colorVar(k)+'"><span class="k">'+k+'</span><span class="nm">'+esc(L.keys[k])+'<small>'+t('report.statMeta',{most:sc.most[k],least:sc.least[k],net:signed(sc.net[k])})+'</small></span><span class="v">'+pct(sc.net[k])+'%</span><div class="bar"><i style="width:'+pct(sc.net[k])+'%"></i></div></div>'; }).join('')+
      '</div>'+
      '<p class="howto">'+t('report.howto')+' <a href="'+ROOT_REL+LANG_PATH[L.lang]+'results/">'+t('report.moreLink')+'</a></p>'+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="sections">'+
      '<div class="sec full"><h3>'+t('report.traits')+'</h3><div class="traits">'+st.traits.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('')+'</div>'+
        (cls.s ? '<div class="substyle" style="--ks:'+colorVar(cls.s)+'"><b>'+t('report.secondary',{k:cls.s,name:esc(L.keys[cls.s])})+'</b> '+t('report.secondaryAddon',{addon:esc(L.addon[cls.s])})+'</div>' : '')+
      '</div>'+
      '<div class="sec"><h3>'+t('report.strengths')+'</h3>'+list(st.strengths)+'</div>'+
      '<div class="sec"><h3>'+t('report.growth')+'</h3>'+list(st.growth)+'</div>'+
      '<div class="sec"><h3>'+t('report.motivation')+'</h3>'+list(st.motivation)+'</div>'+
      '<div class="sec"><h3>'+t('report.communication')+'</h3>'+list(st.communication)+'</div>'+
      '<div class="sec"><h3>'+t('report.stress')+'</h3><p>'+esc(st.stress)+'</p></div>'+

    (opts.own ?
      '<div class="share no-print" id="sendBox" style="margin-top:16px"><h2>'+t('share.emailTitle')+'</h2>'+
        '<form class="form" id="sendForm" autocomplete="on" novalidate>'+

          '<div class="actions"><button class="btn" type="submit">'+t('share.send')+'</button></div>'+
        '</form>'+
      '</div>'+
      '<div class="share no-print" style="margin-top:16px"><h2>'+t('share.typeTitle')+'</h2>'+
        '<p class="small">'+t('share.typeText',{name:esc(prof.name)})+'</p>'+
        '<div class="actions">'+shareNetLinks(profileURL, shareMsg)+'<button class="btn secondary small" type="button" id="shareType">'+t('share.type')+'</button></div>'+
      '</div>'+
      '<div class="share no-print" style="margin-top:16px"><h2>'+t('share.title')+'</h2>'+
        '<p class="small">'+t('share.text')+'</p>'+
        '<textarea class="codebox ym-hide-content" id="code" readonly rows="3" aria-label="'+t('share.codeAria')+'">'+esc(code)+'</textarea>'+
        '<div class="actions"><button class="btn secondary" type="button" id="copyLink">'+t('share.copyLink')+'</button>'+
          '<a class="btn secondary" id="mail" href="'+mailto(CONTACT_EMAIL).replace(/"/g,'&quot;')+'">'+t('share.mail')+'</a>'+
          '<button class="btn secondary" type="button" id="copyCode">'+t('share.copyCode')+'</button>'+
          '<button class="btn secondary" type="button" id="print">'+t('share.pdf')+'</button></div>'+
      '</div>'+
      '<div class="actions no-print" style="margin-top:18px"><button class="link" id="restart" type="button">'+t('share.restart')+'</button></div>'
    :
      '<div class="card no-print" style="margin-top:16px"><h3>'+t('share.codeTitle')+'</h3><textarea class="codebox ym-hide-content" id="code" readonly rows="3" aria-label="'+t('share.codeAria')+'">'+esc(code)+'</textarea>'+
        '<div class="actions"><button class="btn secondary small" type="button" id="copyLink">'+t('share.copyLink')+'</button><button class="btn secondary small" type="button" id="copyCode">'+t('share.copyCode')+'</button><button class="btn secondary small" type="button" id="print">'+t('share.pdf')+'</button></div></div>'

  });
  $('#copyCode').addEventListener('click', function(){ copyText(code, $('#code')); });

  if($('#backAdmin')) $('#backAdmin').addEventListener('click', function(){ renderAdmin(); window.scrollTo(0,0); });
  if(opts.own){
    if(r.email && r.sent) showSendStatus(r, code, 'sent');

      e.preventDefault();
      var name = $('#nm').value.trim().replace(/\s+/g,' '), email = $('#em').value.trim();
      if(name.length<2){ $('#nm').focus(); toast(t('intro.nameRequired')); return; }
      if(!EMAIL_RE.test(email) || email.length>120){ $('#em').focus(); toast(t('intro.emailRequired')); return; }
      lsSet('disc.who',{name:name,email:email});
      // имя и e-mail входят в код результата и ссылку: сервер сверяет адрес письма с кодом
      if(name!==r.name || email!==r.email){ r.name=name; r.email=email; delete r.sent; }
      var last = lsGet('disc.last'); if(last && last.t===r.t){ lsSet('disc.last', r); }
      if(window.discTrack) window.discTrack('email');
      renderReport(r, {own:true, send:true});
      var box = $('#sendBox'); if(box) box.scrollIntoView({block:'center'});
    });
    if(opts.send){

      else copyText(shareMsg+' '+profileURL+"?ref=share", null);
    });

      a.addEventListener('click', function(){ if(window.discTrack){ window.discTrack('share'); window.discTrack('share-'+a.getAttribute('data-net')); } });
    });
  }
}

var SHARE_BY_LANG = {ru:["telegram","vk","whatsapp","linkedin"], en:["facebook","x","linkedin","whatsapp"], es:["whatsapp","facebook","x","linkedin"], pt:["whatsapp","facebook","x","linkedin"],
  fr:["whatsapp","facebook","x","linkedin"], de:["whatsapp","facebook","x","linkedin"], pl:["facebook","whatsapp","x","linkedin"], tr:["whatsapp","x","facebook","linkedin"],
  ar:["whatsapp","x","facebook","telegram"], hi:["whatsapp","facebook","x","linkedin"], id:["whatsapp","facebook","x","telegram"],
  ja:["line","x","facebook"], "zh-hant":["line","facebook","x"], zh:["weibo"]};
function shareNetLinks(url, text){
  return (SHARE_BY_LANG[L.lang]||SHARE_BY_LANG.en).map(function(id){
    var n = SHARE_NETS[id], e = encodeURIComponent;
    var u = url+"?ref="+id; // ?ref=<сеть>: страница профиля покажет пришедшему баннер-приглашение пройти тест (см. build.js)
    var href = n.url.replace("{u}", e(u)).replace("{t}", e(text)).replace("{tu}", e(text+" "+u));
    return '<a class="btn secondary small sharenet" data-net="'+id+'" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer" title="'+esc(t("share.via",{net:n.name}))+'">'+
      '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="'+n.color+'"><path d="'+n.icon+'"/></svg>'+esc(n.name)+'</a>';
  }).join("");
}
function arrowR(){ return L.dir==='rtl' ? '←' : '→'; }

/* ====== отправка результата на сервер: письмо участнику + запись в базу результатов (Google Таблица) ====== */
function postJSON(url, data){
  return new Promise(function(resolve, reject){
    var ctrl = window.AbortController ? new AbortController() : null, done = false;
    var tm = setTimeout(function(){ if(done) return; done = true; if(ctrl) ctrl.abort(); reject(new Error('timeout')); }, 25000);
    // Content-Type не задаём: «простой» запрос без preflight, который принимает Google Apps Script
    fetch(url, {method:'POST', body:JSON.stringify(data), signal: ctrl ? ctrl.signal : undefined, redirect:'follow'})
      .then(function(res){ return res.text(); })
      .then(function(txt){ if(done) return; done = true; clearTimeout(tm); var j = null; try{ j = JSON.parse(txt); }catch(e){}
        if(j && j.ok) resolve(j); else reject(new Error((j && j.error) || 'bad response')); })
      .catch(function(err){ if(done) return; done = true; clearTimeout(tm); reject(err); });
  });
}
function showSendStatus(r, code, state){
  var el = $('#sendStatus'); if(!el) return;
  var st = state || (r.sent ? 'sent' : 'failed');
  el.hidden = false;
  if(st==='mailto'){ el.className='small sendstatus muted'; el.textContent = t('share.mailtoOpened',{email:r.email}); return; }
  if(st==='sending'){ el.className='small sendstatus muted'; el.textContent = t('share.sending',{email:r.email}); return; }
  if(st==='sent'){ el.className='small sendstatus ok'; el.textContent = t('share.sent',{email:r.email}); return; }
  el.className='small sendstatus err';
  el.innerHTML = esc(t('share.sendFailed',{email:r.email}))+' <button class="link" type="button" id="resend">'+t('share.retry')+'</button>';
  $('#resend').addEventListener('click', function(){ sendResult(r, code); });
}
function sendResult(r, code){
  // Сервер сначала записывает результат в таблицу, потом шлёт письмо; повтор того же кода строку не дублирует
  showSendStatus(r, code, 'sending');
  postJSON(SEND_ENDPOINT, {token:SEND_TOKEN, to:r.email, lang:L.lang, code:code}).then(function(){
    r.sent = new Date().toISOString();
    var last = lsGet('disc.last'); if(last && last.t===r.t){ last.sent = r.sent; lsSet('disc.last', last); }
    showSendStatus(r, code, 'sent');
  }, function(){ showSendStatus(r, code, 'failed'); });
}

/* ====== экран 4: панель администратора ====== */
function getResults(){ var a = lsGet('disc.admin'); return Array.isArray(a)?a:[]; }
function renderAdmin(){
  progEl.hidden=true; setStep(t('admin.step'));
  var items = getResults().map(function(it){ var r = decodeResult(it.code); return r ? {code:it.code, added:it.added, r:r, a:analyze(r)} : null; }).filter(Boolean);
  items.sort(function(a,b){ return (b.r.t||'').localeCompare(a.r.t||''); });
  var rows = items.map(function(it, idx){
    var sc=it.a.sc, cls=it.a.cls;
    return '<tr>'+
      '<td><b>'+(esc(it.r.name)||'—')+'</b>'+((it.r.email||it.r.pos)?'<br><span class="muted small">'+esc(it.r.email||it.r.pos)+'</span>':'')+'</td>'+
      '<td>'+esc(fmtDateShort(it.r.t))+'</td>'+
      '<td>'+badgeHTML(cls,'pill')+'<small>'+esc(it.a.profile.name)+'</small></td>'+
      KEYS.map(function(k){ return '<td class="num">'+signed(sc.net[k])+'</td>'; }).join('')+
      '<td><button class="btn secondary small" type="button" data-open="'+idx+'">'+t('admin.open')+'</button> <button class="link" type="button" data-del="'+idx+'">'+t('admin.delete')+'</button></td>'+
    '</tr>';
  }).join('');
  view.innerHTML =
    '<div class="eyebrow">'+t('admin.eyebrow')+'</div>'+
    '<h1>'+t('admin.h1')+'</h1>'+
    '<p class="lead">'+t('admin.lead')+'</p>'+
    '<div class="card"><form id="addForm" class="form">'+
      '<div class="field"><label for="codes">'+t('admin.codesLabel')+'</label><textarea id="codes" placeholder="'+esc(t('admin.placeholder'))+'"></textarea></div>'+
      '<div class="actions between"><button class="btn" type="submit">'+t('admin.add')+'</button><span class="small muted">'+t('admin.total',{n:items.length})+'</span></div>'+
    '</form></div>'+
    '<div class="stack" style="margin-top:16px">'+
      '<div class="tablewrap">'+(items.length ?
        '<table class="ym-hide-content"><thead><tr><th>'+t('admin.thName')+'</th><th>'+t('admin.thDate')+'</th><th>'+t('admin.thProfile')+'</th><th class="num">D</th><th class="num">I</th><th class="num">S</th><th class="num">C</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
        : '<div class="empty">'+t('admin.empty')+'</div>')+'</div>'+
      (items.length ? '<div class="actions between"><button class="btn secondary small" type="button" id="csv">'+t('admin.csv')+'</button><button class="link" type="button" id="clear">'+t('admin.clear')+'</button></div>' : '')+
    '</div>'+
    '<p class="small muted" style="margin-top:20px">'+t('admin.linkNote')+' <b dir="ltr">'+esc(pageURL())+'</b></p>'+
    '<p class="no-print"><button class="link" id="toIntro" type="button">'+t('admin.back')+'</button></p>';

  $('#addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var codes = findCodes($('#codes').value), list = getResults(), added=0, bad=0;
    codes.forEach(function(c){
      if(!decodeResult(c)){ bad++; return; }
      if(list.some(function(x){ return x.code===c; })) return;
      list.push({code:c, added:new Date().toISOString()}); added++;
    });
    lsSet('disc.admin', list);
    if(!codes.length) toast(t('admin.noCode',{v:VERSION}));
    else toast(added ? t('admin.added',{n:added})+(bad?t('admin.withErrors',{n:bad}):'') : (bad ? t('admin.broken') : t('admin.dup')));
    renderAdmin();
  });
  view.querySelectorAll('[data-open]').forEach(function(b){ b.addEventListener('click', function(){ renderReport(items[+b.getAttribute('data-open')].r, {fromAdmin:true}); window.scrollTo(0,0); }); });
  view.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){
    var it = items[+b.getAttribute('data-del')];
    if(!confirm(t('admin.confirmDel',{name:it.r.name}))) return;
    lsSet('disc.admin', getResults().filter(function(x){ return x.code!==it.code; }));
    renderAdmin();
  }); });
  if($('#clear')) $('#clear').addEventListener('click', function(){ if(confirm(t('admin.confirmClear'))){ lsDel('disc.admin'); renderAdmin(); } });
  if($('#csv')) $('#csv').addEventListener('click', function(){
    var head = L.ui['admin.csvHead'];
    var tsv = [head.join('\t')].concat(items.map(function(it){
      var sc=it.a.sc; return [it.r.name, it.r.email||it.r.pos||'', fmtDateShort(it.r.t), it.a.cls.key, it.a.profile.name,
        sc.net.D, sc.net.I, sc.net.S, sc.net.C, sc.most.D, sc.most.I, sc.most.S, sc.most.C, sc.least.D, sc.least.I, sc.least.S, sc.least.C, it.code]
        .map(function(v){ return String(v).replace(/[\t\r\n]+/g,' '); }).join('\t');
    })).join('\n');
    copyText(tsv, null);
  });
  $('#toIntro').addEventListener('click', function(){ if(location.hash) history.replaceState(null,'',pageURL()); renderIntro(); window.scrollTo(0,0); });
}

/* ====== переключение языка ====== */
function langHref(code){ return ROOT_REL + (LANG_PATH[code]||'') + location.hash; }
// Root page: a language chosen explicitly earlier opens right away (search bots have no stored choice)
(function(){ if(!IS_ROOT) return; var st = lsGet('disc.lang'); if(st && st!==L.lang && LANG_PATH[st]!=null && !location.hash) location.replace(langHref(st)); })();
__COMMON_JS__
initCommon({L:L, t:t, esc:esc, lsGet:lsGet, lsSet:lsSet, langHref:langHref, $:$, langMeta:LANG_META, langPath:LANG_PATH, privacyHref:ROOT_REL+(LANG_PATH[L.lang]||'')+'privacy/'});

/* ====== маршрутизация ====== */
$('#adminLink').addEventListener('click', function(){ renderAdmin(); window.scrollTo(0,0); });
$('#brand').addEventListener('click', function(e){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0) return; // новая вкладка и т.п. — обычная ссылка
  e.preventDefault(); S=null;
  if(location.hash) history.replaceState(null,'',pageURL());
  renderIntro(); window.scrollTo(0,0);
});
function route(){
  var h = location.hash||'';
  if(h==='#admin'){ renderAdmin(); return true; }
  if(h.indexOf('#r=')===0){ var r = decodeResult(decodeURIComponent(h.slice(3))); if(r){ renderReport(r, {own:false}); return true; } }
  return false;
}
window.addEventListener('hashchange', function(){ if(!route() && !S) renderIntro(); });
if(!route()) renderIntro();
})();
