<style>
:root{color-scheme:light dark;--paper:#F3F4F6;--surface:#fff;--ink:#1B2027;--muted:#5B6470;--line:#D9DDE3;--btn:#1B2027;--btn-ink:#F7F8FA;--focus:#3B6FB6}
@media (prefers-color-scheme:dark){:root{--paper:#14171B;--surface:#1C2026;--ink:#ECEEF1;--muted:#9AA3AE;--line:#2C323A;--btn:#ECEEF1;--btn-ink:#14171B;--focus:#6390D4}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:48px 20px}
.dots{display:inline-flex;gap:4px;margin-bottom:18px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
h2{font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0 0 12px}
.suggest{display:none;margin:0 0 28px}
.suggest.on{display:block}
.suggest a{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:12px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-size:18px;font-weight:600}
.suggest a .flag{box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.suggest a small{font-size:15px;font-weight:500;opacity:.8}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
li a{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500}
li a:hover{border-color:var(--muted)}
li.is-suggested a{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.flag{width:22px;height:15px;border-radius:2.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none}
@media (max-width:420px){ul{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><symbol id="flag-en" viewBox="0 0 30 20"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#C8102E" stroke-width="1.6"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#C8102E" stroke-width="3.6"/></symbol><symbol id="flag-ru" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/></symbol><symbol id="flag-es" viewBox="0 0 30 20"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></symbol><symbol id="flag-zh" viewBox="0 0 30 20"><rect width="30" height="20" fill="#EE1C25"/><polygon points="5.00,2.00 5.67,4.07 7.85,4.07 6.09,5.35 6.76,7.43 5.00,6.15 3.24,7.43 3.91,5.35 2.15,4.07 4.33,4.07" fill="#FFDE00"/><polygon points="10.00,1.00 10.22,1.69 10.95,1.69 10.36,2.12 10.59,2.81 10.00,2.38 9.41,2.81 9.64,2.12 9.05,1.69 9.78,1.69" fill="#FFDE00"/><polygon points="12.00,3.20 12.22,3.89 12.95,3.89 12.36,4.32 12.59,5.01 12.00,4.58 11.41,5.01 11.64,4.32 11.05,3.89 11.78,3.89" fill="#FFDE00"/><polygon points="12.00,6.00 12.22,6.69 12.95,6.69 12.36,7.12 12.59,7.81 12.00,7.38 11.41,7.81 11.64,7.12 11.05,6.69 11.78,6.69" fill="#FFDE00"/><polygon points="10.00,8.00 10.22,8.69 10.95,8.69 10.36,9.12 10.59,9.81 10.00,9.38 9.41,9.81 9.64,9.12 9.05,8.69 9.78,8.69" fill="#FFDE00"/></symbol><symbol id="flag-ar" viewBox="0 0 30 20"><rect width="30" height="20" fill="#006C35"/><path d="M7 8.5c1.5-2.2 3-2.2 4 0s2.5 2.2 4 0 3-2.2 4 0 2.5 2.2 4 0" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M7.5 13.5H21.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M21.2 12.2v2.6" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></symbol><symbol id="flag-pt" viewBox="0 0 30 20"><rect width="30" height="20" fill="#009C3B"/><polygon points="15,2.5 27,10 15,17.5 3,10" fill="#FFDF00"/><circle cx="15" cy="10" r="4.6" fill="#002776"/><path d="M10.7 9.3c2.9-1.5 5.9-1.3 8.6.4" fill="none" stroke="#fff" stroke-width=".9"/></symbol><symbol id="flag-fr" viewBox="0 0 30 20"><rect width="10" height="20" fill="#0055A4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#EF4135"/></symbol><symbol id="flag-de" viewBox="0 0 30 20"><rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/></symbol><symbol id="flag-ja" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#BC002D"/></symbol><symbol id="flag-hi" viewBox="0 0 30 20"><rect width="30" height="6.67" fill="#FF9933"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#138808"/><circle cx="15" cy="10" r="2.6" fill="none" stroke="#000080" stroke-width=".8"/><circle cx="15" cy="10" r=".6" fill="#000080"/></symbol></svg>
<div class="wrap">
  <div class="dots"><i style="background:#C9453D"></i><i style="background:#D6961F"></i><i style="background:#3A9A69"></i><i style="background:#3B6FB6"></i></div>
  <h1>DISC Test</h1>
  <p>Free DISC test: 24 blocks, about 10 minutes, instant results.</p>
  <div class="suggest" id="suggest"></div>
  <h2>Choose your language</h2>
  <ul id="langs"><li><a href="./en/" hreflang="en" lang="en" data-lang="en" data-continue="Continue"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-en"/></svg><span>English</span></a></li><li><a href="./ru/" hreflang="ru" lang="ru" data-lang="ru" data-continue="Продолжить"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-ru"/></svg><span>Русский</span></a></li><li><a href="./es/" hreflang="es" lang="es" data-lang="es" data-continue="Continuar"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-es"/></svg><span>Español</span></a></li><li><a href="./zh/" hreflang="zh-Hans" lang="zh" data-lang="zh" data-continue="继续"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-zh"/></svg><span>简体中文</span></a></li><li><a href="./ar/" hreflang="ar" lang="ar" data-lang="ar" data-continue="متابعة"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-ar"/></svg><span>العربية</span></a></li><li><a href="./pt/" hreflang="pt" lang="pt" data-lang="pt" data-continue="Continuar"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-pt"/></svg><span>Português</span></a></li><li><a href="./fr/" hreflang="fr" lang="fr" data-lang="fr" data-continue="Continuer"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-fr"/></svg><span>Français</span></a></li><li><a href="./de/" hreflang="de" lang="de" data-lang="de" data-continue="Weiter"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-de"/></svg><span>Deutsch</span></a></li><li><a href="./ja/" hreflang="ja" lang="ja" data-lang="ja" data-continue="続ける"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-ja"/></svg><span>日本語</span></a></li><li><a href="./hi/" hreflang="hi" lang="hi" data-lang="hi" data-continue="जारी रखें"><svg class="flag" aria-hidden="true" focusable="false"><use href="#flag-hi"/></svg><span>हिन्दी</span></a></li></ul>
</div>
<script>
(function(){
  // Автоперенаправления нет: страница показывает все языковые версии (так советует Google),
  // а ранее выбранный или определённый по настройкам браузера язык выносится наверх кнопкой.
  var links = document.querySelectorAll('#langs a'), hash = location.hash || '';
  var LANGS = [], byLang = {};
  for (var i = 0; i < links.length; i++) {
    var l = links[i].getAttribute('data-lang'); LANGS.push(l); byLang[l] = links[i];
    if (hash) links[i].setAttribute('href', links[i].getAttribute('href') + hash);
  }
  var pick = null;
  try { var s = JSON.parse(localStorage.getItem('disc.lang')); if (LANGS.indexOf(s) >= 0) pick = s; } catch (e) {}
  if (!pick) {
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var j = 0; j < prefs.length && !pick; j++) { var p = String(prefs[j]).toLowerCase().split('-')[0]; if (LANGS.indexOf(p) >= 0) pick = p; }
  }
  if (!pick) return;
  var a = byLang[pick]; a.parentNode.className = 'is-suggested';
  var btn = document.createElement('a');
  btn.setAttribute('href', a.getAttribute('href')); btn.setAttribute('lang', pick); btn.setAttribute('hreflang', a.getAttribute('hreflang'));
  var fl = a.querySelector('.flag'); if (fl) btn.appendChild(fl.cloneNode(true));
  var span = document.createElement('span'); span.setAttribute('dir', 'auto');
  span.appendChild(document.createTextNode(a.getAttribute('data-continue') + ' · '));
  var sm = document.createElement('small'); sm.textContent = a.querySelector('span').textContent; span.appendChild(sm);
  btn.appendChild(span);
  var box = document.getElementById('suggest'); box.appendChild(btn); box.className = 'suggest on';
})();
</script>
