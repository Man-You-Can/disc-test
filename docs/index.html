<script>
(function(){
  var LANGS = ["en","ru","es","zh","ar","pt","fr","de","ja","hi"], DEF = 'en';
  var pick = null;
  try{ var s = JSON.parse(localStorage.getItem('disc.lang')); if(LANGS.indexOf(s)>=0) pick = s; }catch(e){}
  if(!pick){
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||''];
    for(var i=0;i<prefs.length && !pick;i++){ var p = String(prefs[i]).toLowerCase().split('-')[0]; if(LANGS.indexOf(p)>=0) pick = p; }
  }
  location.replace('./'+(pick||DEF)+'/'+location.hash);
})();
</script>
<style>
:root{color-scheme:light dark;--paper:#F3F4F6;--surface:#fff;--ink:#1B2027;--muted:#5B6470;--line:#D9DDE3}
@media (prefers-color-scheme:dark){:root{--paper:#14171B;--surface:#1C2026;--ink:#ECEEF1;--muted:#9AA3AE;--line:#2C323A}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:48px 20px}
.dots{display:inline-flex;gap:4px;margin-bottom:18px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500}
a:hover{border-color:var(--muted)}
a{display:flex;align-items:center;gap:10px}
.flag{width:22px;height:15px;border-radius:2.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none}
</style>
